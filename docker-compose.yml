
services:
  backend-1:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      INSTANCE_ID: "server-1"

  backend-2:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      INSTANCE_ID: "server-2"

  backend-3:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      INSTANCE_ID: "server-3"
  auth:
    build: ./auth
    env_file:
      - ./auth/.env
    environment:
      PORT: "4001"
    expose:
      - "4001"
  gateway:
    build: ./gateway
    env_file:
      - ./gateway/.env
    environment:
      PORT: "4000"
      INSTANCE_ID: "gateway-1"
    depends_on:
      - auth
      - backend-1
      - backend-2
      - backend-3
  #the gateway image depends on the 3 backend instances
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    #nginx depends on gateway
#the flow of request is client -> nginx(load balancer)-> gateway -> based on the url/serviice to thebackend
