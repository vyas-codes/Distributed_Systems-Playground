
services:
  backend-1:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      INSTANCE_ID: "server-1"

  backend-2:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      INSTANCE_ID: "server-2"

  backend-3:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      INSTANCE_ID: "server-3"

  auth:
    build: ./auth
    env_file:
      - ./auth/.env
    environment:
      PORT: "4001"
    expose:
      - "4001"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway-1:
    build: ./gateway
    env_file:
      - ./gateway/.env
    environment:
      PORT: "4000"
      INSTANCE_ID: "gateway-1"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      auth:
        condition: service_started
      backend-1:
        condition: service_started
      backend-2:
        condition: service_started
      backend-3:
        condition: service_started
      redis:
        condition: service_healthy

  gateway-2:
    build: ./gateway
    env_file:
      - ./gateway/.env
    environment:
      PORT: "4000"
      INSTANCE_ID: "gateway-2"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      auth:
        condition: service_started
      backend-1:
        condition: service_started
      backend-2:
        condition: service_started
      backend-3:
        condition: service_started
      redis:
        condition: service_healthy

  gateway-3:
    build: ./gateway
    env_file:
      - ./gateway/.env
    environment:
      PORT: "4000"
      INSTANCE_ID: "gateway-3"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      auth:
        condition: service_started
      backend-1:
        condition: service_started
      backend-2:
        condition: service_started
      backend-3:
        condition: service_started
      redis:
        condition: service_healthy


  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3

volumes:
  redis-data:
#nginx depends on gateway
#the flow of request is client -> nginx(load balancer)-> gateway -> based on the url/serviice to thebackend